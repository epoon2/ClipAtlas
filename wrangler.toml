name = "clipatlas-planner"
main = "src/worker.js"
compatibility_date = "2026-10-25"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/s/*", "/join/*"]

[vars]
REGISTRATION_ENABLED = "true"
AUTO_REVIEW_DAILY_LIMIT = "300"

# Workers AI, for auto-review (transcripts and reading screenshots).
[ai]
binding = "AI"

# Gemini (Google's free tier) for auto-review is set up with secrets in the Cloudflare
# dashboard, never here: GEMINI_API_KEY (required), GEMINI_USERS (sign-in emails allowed
# to use it, comma-separated; recommended) and GEMINI_MODELS (optional). See the README.

[[d1_databases]]
binding = "DB"
database_name = "clipatlas-db"
database_id = "aeb53b56-03db-4e1b-a4c0-cbaa9b381ac5"
migrations_dir = "migrations"
